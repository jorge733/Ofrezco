<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Service Planet</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="header container">
    <a class="logo" href="index.html" aria-label="Service Planet, ir al inicio"><img src="logo.svg" alt="" width="36" height="36">Service<span>Planet</span></a>
  </header>

  <main class="container app-main">
    <section class="auth-card">
      <p class="eyebrow" id="auth-eyebrow">CREA TU CUENTA</p>
      <h1 id="auth-title">Empieza tu página</h1>

      <form class="form" id="auth-form">
        <!-- Solo al crear cuenta -->
        <label id="name-field">Tu nombre
          <input id="nombre" maxlength="60" autocomplete="name" placeholder="Ej: Camila Rojas">
        </label>
        <label>Correo
          <input type="email" id="email" required autocomplete="email">
        </label>
        <label>Contraseña
          <span class="password-field">
            <input type="password" id="password" required minlength="6" autocomplete="new-password">
            <button class="password-toggle" type="button" data-target="password" aria-label="Mostrar contraseña"></button>
          </span>
          <small class="field-hint" id="password-hint">Mínimo 6 caracteres.</small>
        </label>
        <!-- Solo al crear cuenta -->
        <label id="confirm-field">Confirma tu contraseña
          <span class="password-field">
            <input type="password" id="password2" minlength="6" autocomplete="new-password">
            <button class="password-toggle" type="button" data-target="password2" aria-label="Mostrar contraseña"></button>
          </span>
        </label>
        <p class="form-message" id="auth-message" role="alert"></p>
        <button class="button" type="submit" id="auth-submit">Crear cuenta</button>
      </form>

      <p class="auth-switch">
        <span id="switch-text">¿Ya tienes cuenta?</span>
        <button class="link-button" type="button" id="switch-mode">Inicia sesión</button>
      </p>
      <button class="link-button auth-forgot" type="button" id="forgot" hidden>¿Olvidaste tu contraseña?</button>
    </section>
  </main>

  <script type="module" src="cuenta.js"></script>
</body>
</html>
