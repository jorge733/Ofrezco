<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — ServicePlanet</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Vercel muestra esta página cuando un enlace no existe (por ejemplo serviceplanet.cl/algo/raro) -->
  <main class="lost">
    <div class="welcome-stars" aria-hidden="true"></div>
    <div class="welcome-comet" aria-hidden="true"></div>
    <div class="lost-content">
      <p class="lost-code" aria-hidden="true">4<img src="/logo.svg" alt="">4</p>
      <h1>Esta página se perdió <em>en el espacio</em></h1>
      <p class="lost-text">No encontramos lo que buscabas. Revisa que el enlace esté bien escrito o vuelve al inicio.</p>
      <div class="lost-actions">
        <a class="button" href="/">Ir al inicio</a>
        <a class="button button-outline lost-home" href="/cuenta">Crear mi página gratis</a>
      </div>
    </div>
  </main>
</body>
</html>
